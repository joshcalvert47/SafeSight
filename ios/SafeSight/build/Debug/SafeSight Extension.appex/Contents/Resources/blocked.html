<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="icon.png">
    <title>Site Blocked — SafeSight</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* The app icon, on the same gradient tile the app's home screen uses
           (the artwork itself is a transparent-background mark). */
        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            padding: 6px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .logo-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }

        .site {
            display: inline-block;
            max-width: 100%;
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
            font: 600 0.95rem ui-monospace, SFMono-Regular, Menlo, monospace;
            padding: 6px 12px;
            border-radius: 8px;
            margin: 8px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reason {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 12px 0 24px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font: 600 0.9rem 'Outfit', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text);
        }

        .hint {
            margin-top: 24px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo-icon"><img src="icon.png" alt="SafeSight"></div>
        <h1 id="pageTitle">Site Blocked</h1>
        <div class="site" id="blockedSite">this site</div>
        <p class="reason" id="pageReason">
            SafeSight blocked this site because it appears on your block list.
            The default list ships in <strong>blocklist.json</strong>; edit your
            list any time from the SafeSight popup.
        </p>
        <div class="actions">
            <button id="backBtn" class="btn btn-primary">Go back</button>
            <button id="retryBtn" class="btn btn-secondary">Try again</button>
        </div>
        <p class="hint">Powered by LiteRT • SafeSight site blocking</p>
    </div>
    <script src="blocked.js"></script>
</body>

</html>
