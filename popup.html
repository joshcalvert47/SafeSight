<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="logo-icon">🛡️</div>
        <h2>SafeSight</h2>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-value" id="statScanned">0</span>
            <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statBlocked">0</span>
            <span class="stat-label">Blocked</span>
        </div>
    </div>

    <div class="status-card">
        <div class="control-group">
            <div class="control-item">
                <div class="label-info">
                    <span>Show Ratings</span>
                    <span>Display safety scores</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="showRatings" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-item">
                <div class="label-info">
                    <span>Skin Filter</span>
                    <span>Cover detected skin pixels</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="skinFilter">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-item" style="flex-direction: column; align-items: flex-start;">
                <div class="label-info" style="margin-bottom: 8px;">
                    <span>Filter Sensitivity</span>
                    <span id="sensitivityVal">Standard (4)</span>
                </div>
                <div class="range-container">
                    <input type="range" id="sensitivity" min="1" max="9" step="1" value="4" class="sensitivity-range">
                    <div class="range-labels">
                        <span>Relaxed</span>
                        <span>Strict</span>
                    </div>
                </div>
            </div>

            <div class="control-item">
                <div class="label-info">
                    <span>Blur All</span>
                    <span>Maximum protection</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="blurAll">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="admin-section">
            <button id="adminMode" class="admin-btn">Unlock Admin Mode</button>
            <button id="resetStats" class="admin-btn admin-btn-secondary" style="margin-top:8px;">Reset Statistics</button>
        </div>
    </div>

    <div class="footer">
        Powered by LiteRT • Persistent Engine v1.3
    </div>

    <script src="popup.js"></script>
</body>

</html>
