<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="brand">
            <div class="logo-icon"><img src="icon.png" alt="SafeSight"></div>
            <h2>SafeSight</h2>
        </div>
        <div class="account-area">
            <button id="profileBtn" class="user-profile" style="display: none;" aria-haspopup="menu" aria-expanded="false">
                <span id="userName" class="user-name">User</span>
                <span id="userStatusDot" class="status-dot" title="Account status"></span>
                <span id="userAvatar" class="user-avatar"></span>
            </button>
            <button id="signInBtn" class="sign-in-btn" style="display: none;">Sign in</button>

            <div id="profileMenu" class="profile-menu" style="display: none;" role="menu">
                <div class="profile-menu-head">
                    <div id="menuAvatar" class="menu-avatar"></div>
                    <div class="profile-menu-id">
                        <div id="menuName" class="menu-name"></div>
                        <div id="menuEmail" class="menu-email"></div>
                    </div>
                </div>
                <div class="profile-menu-status">
                    <span id="menuStatusDot" class="status-dot"></span>
                    <span id="menuStatusText">Active</span>
                </div>
                <div class="profile-menu-actions">
                    <button id="menuAccount" class="menu-action" role="menuitem">Account settings</button>
                    <button id="menuSignOut" class="menu-action menu-action-danger" role="menuitem">Sign out of this device</button>
                </div>
            </div>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-value" id="statScanned">0</span>
            <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statBlocked">0</span>
            <span class="stat-label">Blocked</span>
        </div>
    </div>

    <div class="status-card">
        <div class="control-group">
            <div class="control-item">
                <div class="label-info">
                    <span class="label-title">Skin Filter</span>
                    <span class="label-desc">Cover detected skin pixels</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="skinFilter">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-item" style="flex-direction: column; align-items: flex-start;">
                <div class="label-info" style="margin-bottom: 8px;">
                    <span class="label-title">Filter Sensitivity</span>
                    <span id="sensitivityVal" class="label-desc">Standard (4)</span>
                </div>
                <div class="range-container">
                    <input type="range" id="sensitivity" min="1" max="9" step="1" value="4" class="sensitivity-range">
                    <div class="range-labels">
                        <span>Relaxed</span>
                        <span>Strict</span>
                    </div>
                </div>
            </div>

            <div class="control-item">
                <div class="label-info">
                    <span class="label-title">Blur All</span>
                    <span class="label-desc">Maximum protection</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="blurAll">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="blocklist-section">
            <div class="label-info">
                <span class="label-title">Blocked Sites</span>
                <span class="label-desc">Sites that can't be opened at all</span>
            </div>
            <div class="blocklist-row">
                <input type="text" id="blockSiteInput" placeholder="example.com" spellcheck="false" autocomplete="off">
                <button id="blockSiteAdd" class="blocklist-add">Add</button>
            </div>
            <ul id="blockSiteList" class="blocklist"></ul>
            <div class="blocklist-note" id="blocklistNote">Defaults loaded from blocklist.json</div>
        </div>

    </div>

    <div class="footer">
        Powered by LiteRT • Persistent Engine v1.3
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
